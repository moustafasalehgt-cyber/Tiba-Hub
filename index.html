<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز أدوات طيبة</title>
<style>
  :root{
    --navy:#0b1f3a;
    --navy-2:#132a4d;
    --navy-3:#1c3a63;
    --gold:#c9a24b;
    --gold-light:#e6c976;
    --text-light:#eef2f7;
    --text-dim:#9fb0c8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    display:flex;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:var(--navy);
    color:var(--text-light);
  }

  /* Sidebar */
  #sidebar{
    width:280px;
    min-width:280px;
    background:linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
    border-left:3px solid var(--gold);
    display:flex;
    flex-direction:column;
    position:relative;
    transition:width .25s ease, min-width .25s ease, border-color .25s ease;
    overflow:hidden;
  }
  #sidebar.collapsed{
    width:0;
    min-width:0;
    padding-left:0;
    padding-right:0;
    border-left-width:0;
  }
  #sidebar-inner{
    width:280px;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:24px 0;
    overflow:hidden;
  }
  .brand{
    padding:0 22px 22px 22px;
    border-bottom:1px solid rgba(201,162,75,0.25);
    margin-bottom:18px;
    white-space:nowrap;
  }
  .brand img.brand-logo{
    max-width:100%;
    height:auto;
    display:block;
    margin-bottom:6px;
  }
  .brand h1{
    font-size:19px;
    color:var(--gold-light);
    letter-spacing:.5px;
  }
  .brand p{
    font-size:12px;
    color:var(--text-dim);
    margin-top:4px;
  }
  nav{flex:1; padding:0 12px; display:flex; flex-direction:column; gap:8px; white-space:nowrap;}
  .nav-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 14px;
    border-radius:10px;
    cursor:pointer;
    color:var(--text-light);
    border:1px solid transparent;
    transition:all .18s ease;
    text-align:right;
  }
  .nav-item:hover{
    background:var(--navy-3);
    border-color:rgba(201,162,75,0.3);
  }
  .nav-item.active{
    background:var(--navy-3);
    border-color:var(--gold);
    box-shadow:inset 3px 0 0 var(--gold);
  }
  .nav-icon{
    font-size:20px;
    width:28px;
    text-align:center;
  }
  .nav-text strong{
    display:block;
    font-size:14.5px;
    color:var(--gold-light);
  }
  .nav-text span{
    display:block;
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .nav-item.active .nav-text strong{color:#fff;}

  .sidebar-footer{
    padding:16px 22px 0 22px;
    border-top:1px solid rgba(201,162,75,0.25);
    margin-top:16px;
    white-space:nowrap;
  }
  .sidebar-footer a{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--text-dim);
    text-decoration:none;
  }
  .sidebar-footer a:hover{color:var(--gold-light);}

  /* Collapse toggle handle - anchored to #main's top-right corner, which is
     always exactly the boundary between sidebar and main content, whether
     the sidebar is expanded or collapsed */
  #collapse-toggle{
    position:absolute;
    top:78px;
    right:0;
    transform:translateX(50%);
    width:26px;
    height:52px;
    background:var(--navy-3);
    border:1px solid var(--gold);
    border-radius:8px;
    color:var(--gold-light);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    z-index:30;
    transition:background .2s ease;
  }
  #collapse-toggle:hover{background:var(--navy);}
  #collapse-toggle .arrow{display:inline-block; transition:transform .25s ease;}
  #sidebar.collapsed ~ #main #collapse-toggle .arrow{transform:rotate(180deg);}

  /* Main */
  #main{
    flex:1;
    position:relative;
    display:flex;
    flex-direction:column;
    background:#f3f4f6;
  }
  #topbar{
    background:#fff;
    border-bottom:1px solid #e2e5ea;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  #topbar h2{
    font-size:16px;
    color:var(--navy);
  }
  #topbar .actions{display:flex; gap:10px;}
  #topbar button{
    background:var(--navy);
    color:var(--gold-light);
    border:1px solid var(--gold);
    padding:7px 14px;
    border-radius:8px;
    font-size:12.5px;
    cursor:pointer;
  }
  #topbar button:hover{background:var(--navy-3);}

  #frame-wrap{flex:1; position:relative;}
  iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
  }
  #placeholder{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#8a93a3;
    gap:10px;
    text-align:center;
    padding:20px;
  }
  #placeholder .big{font-size:44px;}
  #placeholder img.logo{
    max-width:520px;
    width:120%;
    height:auto;
    margin-bottom:6px;
    animation:logo-float 5.25s ease-in-out infinite;
  }
  @keyframes logo-float{
    0%,100%{ transform:translateY(0) scale(1); }
    50%{ transform:translateY(-10px) scale(1.02); }
  }
  @media (prefers-reduced-motion: reduce){
    #placeholder img.logo{ animation:none; }
  }
  #placeholder h3{color:var(--navy); font-size:18px;}
  #placeholder p{font-size:13px; max-width:360px;}

  @media (max-width:820px){
    body{flex-direction:column;}
    #sidebar{
      width:100%; min-width:0; max-height:38vh;
      flex-direction:row; overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding:0;
      border-left:none; border-bottom:3px solid var(--gold);
    }
    #sidebar.collapsed{
      max-height:0;
      border-bottom-width:0;
    }
    #sidebar-inner{
      width:auto;
      min-width:100%;
      height:auto;
      flex-direction:row;
      flex-shrink:0;
      align-items:stretch;
      padding:10px;
      gap:8px;
    }
    .brand, .sidebar-footer{display:none;}
    nav{
      flex:none;
      flex-shrink:0;
      flex-direction:row;
      padding:0;
      gap:8px;
    }
    .nav-item{
      min-width:150px;
      padding:10px 12px;
      flex:0 0 auto;
    }
    .nav-text strong{font-size:13px;}
    .nav-text span{font-size:10.5px;}

    /* the desktop collapse handle sits mid-screen on the sidebar/main
       boundary, which doesn't apply to a stacked mobile layout */
    #collapse-toggle{display:none;}

    #topbar{padding:10px 14px;}
    #topbar h2{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
    #topbar button{padding:6px 10px; font-size:11.5px;}

    #placeholder img.logo{max-width:220px; width:65%;}
    #placeholder h3{font-size:16px;}
    #placeholder p{font-size:12.5px;}
  }

  @media (max-width:480px){
    .nav-item{min-width:130px; padding:8px 10px;}
    .nav-text span{display:none;}
    #topbar h2{font-size:13px;}
    #placeholder img.logo{max-width:170px; width:60%;}
  }
</style>
</head>

            : 'تم تحديث بعض اللينكات فقط';
          placeholderText.textContent = opened === items.length
            ? `اتفتحت ${opened} أدوات في تابات جديدة بأحدث نسخة.`
            : 'المتصفح منع فتح بعض التابات (Popup Blocker). اسمح بالنوافذ المنبثقة لهذا الموقع وحاول تاني.';
        }
      }, i * 250);
    });
  });

  renderNav();
</script>

</body>
</html>
